name: release

# Tag `vX.Y.Z` publishes myopenfund-company-corpus. The `publish` job runs in a
# GitHub environment (`pypi`, or `testpypi` for manual rehearsals) whose required
# reviewer must approve; PyPI trusts this workflow + environment (no token).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        # The publish environment comes from the event name (workflow_dispatch -> testpypi), so a new option needs a workflow change.
        description: Index to publish to (TestPyPI rehearsal only)
        type: choice
        options: [testpypi]
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build . --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls "$PWD"/dist/*.whl)[store]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import company_corpus; print(company_corpus.__file__)"
          "$RUNNER_TEMP/smoke/bin/python" -c "from open_data_store.writer import write_batch"
          "$RUNNER_TEMP/smoke/bin/python" -c "import importlib.resources as r; assert r.files('company_corpus.concepts').joinpath('tags/us_gaap.json').read_text(encoding='utf-8')"
          expected="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('myopenfund-company-corpus'))")"
          shown="$("$RUNNER_TEMP/smoke/bin/company-corpus" --version)"
          if [ "$shown" != "company-corpus $expected" ]; then
            echo "company-corpus --version printed '$shown' but the wheel is $expected"
            exit 1
          fi
      - name: Tag check (the wheel version must equal the tag version)
        if: github.event_name == 'push'
        run: |
          wheel_version="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('myopenfund-company-corpus'))")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$wheel_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag_version but the built myopenfund-company-corpus wheel is $wheel_version"
            exit 1
          fi
          echo "tag and wheel agree: $wheel_version"
      - name: Branch check (the tagged commit must be on main)
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
