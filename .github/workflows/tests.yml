name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. The unit and store jobs install the exact pins of requirements-*.txt, so they run
    # the same sibling versions every week. The package job resolves the [store] range from PyPI
    # and imports the writer: a sibling release inside the range that breaks that install shows
    # up there without waiting for a push.
    - cron: "17 5 * * 1"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Tests are cwd-independent
        run: cd /tmp && pytest -q "$GITHUB_WORKSPACE"

  store:
    # store-batches and the concept Recipe against the real open-data-store (writer + publisher,
    # DuckLake file catalogue). Separate job: open-data-store is an optional extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-store.txt
      - name: Pre-install the DuckLake extension
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL ducklake')"
      - name: Store tests
        env:
          REQUIRE_DUCKLAKE: "1"   # the end-to-end test must run: a skip is a failure here
        # tests/live too: the issuer-table parity tests need the open-data-store contracts, which
        # only this job installs (the unit job skips them).
        run: pytest -q tests/opendata tests/live

  package:
    # The same build, `twine check` and smoke install as release.yml, without the tag check and
    # without publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build . --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls "$PWD"/dist/*.whl)[store]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import company_corpus; print(company_corpus.__file__)"
          "$RUNNER_TEMP/smoke/bin/python" -c "from open_data_store.writer import write_batch"
          "$RUNNER_TEMP/smoke/bin/python" -c "import importlib.resources as r; assert r.files('company_corpus.concepts').joinpath('tags/us_gaap.json').read_text(encoding='utf-8')"
          expected="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('myopenfund-company-corpus'))")"
          shown="$("$RUNNER_TEMP/smoke/bin/company-corpus" --version)"
          if [ "$shown" != "company-corpus $expected" ]; then
            echo "company-corpus --version printed '$shown' but the wheel is $expected"
            exit 1
          fi
      - name: Smoke install of the live extra in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-live"
          "$RUNNER_TEMP/smoke-live/bin/pip" install "$(ls "$PWD"/dist/*.whl)[live]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-live/bin/python" -c "import company_corpus.live.documents"
          "$RUNNER_TEMP/smoke-live/bin/python" -c "import company_corpus.live.issuer"
          "$RUNNER_TEMP/smoke-live/bin/python" -c "from company_corpus.live.documents import _html_converter; _html_converter()"
          "$RUNNER_TEMP/smoke-live/bin/python" -c 'from company_corpus.opendata.batches import contracts_api; contracts_api(needed_by="smoke", extra="live")'
