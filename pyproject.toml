[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-corpus"
version = "0.1.0"
description = "Open-data corpus of company filings (SEC EDGAR + EU OAMs + national registers) — the bottom-up/micro counterpart to central-bank-corpus."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "python-dateutil>=2.9",
    "duckdb>=2.0,<3",
    "pyarrow>=17",
]

[project.optional-dependencies]
# The Belgium (FSMA STORI) backend needs a browser-impersonating HTTP client to
# clear the FSMA F5 WAF. Imported lazily; only required to run the BE backend.
be = ["curl_cffi>=0.7"]
# Tier B ESEF parsing: local .zip packages via Arelle. Imported lazily inside
# oim_from_esef_zip; only required to run the Arelle bridge.
eu-financials = ["arelle-release"]
# my-open-data producer side (``store-batches``, chantier 8): the writer only, pinned to a
# reviewed commit. The CI job "store" also installs the publisher (requirements-store.txt).
store = ["my-open-data[writer] @ git+https://github.com/MyOpenFund/my-open-data@3252e97dd6808290895cc4e117685388e6d4e354"]

[project.scripts]
company-corpus = "company_corpus.cli:main"

[tool.setuptools.packages.find]
include = ["company_corpus*"]

[tool.setuptools.package-data]
"company_corpus.concepts" = ["*.json", "tags/*.json"]
