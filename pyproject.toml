[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "MIT"` (string form) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "myopenfund-company-corpus"
dynamic = ["version"]
description = "Open-data corpus of company filings (SEC EDGAR + EU OAMs + national registers) — the bottom-up/micro counterpart to central-bank-corpus."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Marc Jeulin" }]
maintainers = [{ name = "Marc Jeulin" }]
keywords = ["myopenfund", "sec", "edgar", "esef", "xbrl", "filings", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "python-dateutil>=2.9",
    "duckdb>=2.0,<3",
    "pyarrow>=17",
]

[project.optional-dependencies]
# The Belgium (FSMA STORI) backend needs a browser-impersonating HTTP client to
# clear the FSMA F5 WAF. Imported lazily; only required to run the BE backend.
be = ["curl_cffi>=0.7"]
# Tier B ESEF parsing: local .zip packages via Arelle. Imported lazily inside
# oim_from_esef_zip; only required to run the Arelle bridge.
eu-financials = ["arelle-release"]
# open-data-store producer side (``store-batches``, chantier 8): the writer only, from PyPI,
# capped below the next breaking 0.x. The CI job "store" also installs the publisher
# (requirements-store.txt).
store = ["myopenfund-open-data-store[writer]>=0.1.0,<0.2"]

[project.urls]
Homepage = "https://github.com/MyOpenFund/company-corpus"
Source = "https://github.com/MyOpenFund/company-corpus"
Issues = "https://github.com/MyOpenFund/company-corpus/issues"
Organization = "https://github.com/MyOpenFund"

[project.scripts]
company-corpus = "company_corpus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "company_corpus.__version__" }

[tool.setuptools.packages.find]
include = ["company_corpus*"]

[tool.setuptools.package-data]
"company_corpus.concepts" = ["*.json", "tags/*.json"]
